BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rromero"
BBFILE_PATTERN_rromero = "^${LAYERDIR}/"
# above meta-rauc-qemux86 (6) so our rauc-conf/system.conf wins
BBFILE_PRIORITY_rromero = "7"

LAYERVERSION_rromero = "1"
LAYERDEPENDS_rromero = "core rauc meta-rauc-qemux86 openembedded-layer"
LAYERSERIES_COMPAT_rromero = "scarthgap"
