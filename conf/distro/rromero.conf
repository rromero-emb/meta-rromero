# Small systemd distro for field devices with A/B updates.
require conf/distro/poky.conf

DISTRO = "rromero"
DISTRO_NAME = "rromero reference distro"
DISTRO_VERSION = "1.0"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " rauc"
# headless device: no graphics, audio servers or radios we do not use
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pulseaudio bluetooth wifi 3g nfc zeroconf"

# Hardening flags (-fstack-protector-strong, _FORTIFY_SOURCE=2, -z relro -z now, PIE) come
# from conf/distro/include/security_flags.inc, which poky.conf already requires.

# SPDX 2.2 SBOM per image (deploy/images/<machine>/*.spdx.*); explicit even if poky enables it
INHERIT += "create-spdx"
SPDX_PRETTY = "1"

# record every package's licence text in the image manifest
COPY_LIC_MANIFEST = "1"
COPY_LIC_DIRS = "1"

PACKAGE_CLASSES = "package_ipk"
